<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농구심판연습 v1.3</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        :root { --main-dark: #2c3e50; --lead-red: #e74c3c; --trail-blue: #3498db; }
        body { background-color: #f1f3f5; font-family: 'Pretendard', sans-serif; margin: 0; }
        .tag-block { display: inline-block; padding: 4px 10px; margin-right: 5px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
        .bg-pos { background-color: var(--main-dark); color: white; }
        .bg-qtr { background-color: #d35400; color: white; }
        .bg-dir { background-color: #27ae60; color: white; }
        .card-main { min-height: 250px; background: white; border-radius: 12px; border-top: 6px solid var(--main-dark); }
        .team-info { padding: 12px; border-radius: 8px; margin: 10px 0; font-weight: 500; border: 1px solid #eee; }
        .def-focus { border-left: 5px solid var(--lead-red); background-color: #fdf2f2; }
        .off-focus { border-left: 5px solid var(--trail-blue); background-color: #ebf5fb; }
        .hidden { display: none; }
        .btn-ox { font-size: 2.5em; width: 45%; margin: 2%; font-weight: bold; }
        .progress-bar { height: 8px; background-color: #eee; border-radius: 10px; margin-bottom: 15px; }
        .progress-fill { height: 100%; background-color: #9b59b6; border-radius: 10px; transition: 0.3s; }
    </style>
</head>

</div>
