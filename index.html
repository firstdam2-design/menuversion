<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농구심판연습 v3.3</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        :root { --main-dark: #2c3e50; --lead-red: #e74c3c; --trail-blue: #3498db; }
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding-bottom: 50px; }
        
        .header { background-color: var(--main-dark); color: white; padding: 12px; text-align: center; border-bottom: 4px solid #1a252f; }
        .ver { font-size: 0.7em; color: #bdc3c7; font-weight: normal; margin-left: 8px; }

        .tab-bar { display: flex; background: #eee; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; cursor: pointer; color: #666; transition: 0.2s; }
        .tab-active { background: #ff9800 !important; color: white !important; }

        .tag-row { display: flex; gap: 8px; justify-content: center; margin: 15px 0; min-height: 32px; }
        .tag { padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85em; color: white; }
        .tag-pos { background-color: #34495e; }
        .tag-qtr { background-color: #d35400; }
        .tag-dir { background-color: #27ae60; }

        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; max-width: 550px; margin: 0 auto; border-top: 6px solid var(--main-dark); }
        
        /* 팀 정보 한 줄 표시 스타일 */
        .team-info-row { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin: 15px 0; 
            font-weight: 900; 
            font-size: 1.35em; 
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .pos-indicator { font-size: 0.7em; color: #999; vertical-align: middle; margin-right: 5px; }

        .situ-box { border: 2px dashed #bbb; padding: 20px; margin-top: 15px; border-radius: 8px; background-color: #fafafa; text-align: left; }
        .
